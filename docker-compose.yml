# Local development services. Start with: docker compose up -d
# Credentials below are local-only development defaults. Ports bind to 127.0.0.1 only.
# Images are pinned by digest (the tag shows the version); update them deliberately.
name: innopower-learn

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    restart: unless-stopped
    environment:
      POSTGRES_USER: innopower
      POSTGRES_PASSWORD: innopower_dev
      POSTGRES_DB: innopower
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innopower -d innopower"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (RustFS 1.0.6). MinIO no longer publishes images; see ADR 0002.
  storage:
    image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: innopower
      RUSTFS_SECRET_KEY: innopower_dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storagedata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://127.0.0.1:9000/health || wget -qO- http://127.0.0.1:9000/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the development bucket, then exits.
  storage-init:
    image: amazon/aws-cli:2.41.2@sha256:7a77ccb39e3272191adbf905c50db8c127db88fd79454911a41a6b1c0e419e9b
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: innopower
      AWS_SECRET_ACCESS_KEY: innopower_dev
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "aws --endpoint-url http://storage:9000 s3api head-bucket --bucket innopower-dev 2>/dev/null ||
      aws --endpoint-url http://storage:9000 s3api create-bucket --bucket innopower-dev; echo bucket ready"
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  storagedata:
